name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Run CPU unit tests
        run: uv run --no-project --with-requirements requirements-dev.txt python -m pytest tests --ignore=tests/integration -q
